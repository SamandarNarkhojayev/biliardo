    <link rel="alternate" hreflang="kk" href="https://biliardo.kz/" />
    <link rel="alternate" hreflang="x-default" href="https://biliardo.kz/" />

    <meta name="geo.region" content="KZ" />
    <meta name="geo.placename" content="Almaty, Astana, Shymkent, Karaganda, Aktobe, Pavlodar, Kazakhstan" />

    <!-- Mobile (standalone). apple-mobile-web-app-capable считается deprecated, но
         iOS Safari всё ещё уважает его на iOS 14+. Современный аналог — mobile-web-app-capable. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Biliardo" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- Fonts: preconnect + НЕблокирующая загрузка через preload+onload.
         Берём только реально используемые веса (400/600/700) — 900 не используется (max — font-extrabold/800).
         media="print" → загрузка асинхронная (не блокирует first paint), onload переключает в 'all'. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" /></noscript>

    <!-- Structured data: Organization -->

      "alternateName": "Билиардо",

      "logo": "https://biliardo.kz/logo.svg",

      "address": {
        "@type": "PostalAddress",
        "addressCountry": "KZ"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Kazakhstan"
      },
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+7-706-686-94-14",
          "contactType": "sales",
          "areaServed": "KZ",
          "availableLanguage": ["Russian", "Kazakh"]
        }
      ],
      "sameAs": [
        "https://wa.me/77066869414"
      ]
    }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">

    }
    </script>
