# Внутренний nginx-конфиг контейнера web.
# Раздаёт Vite SPA, SPA-fallback на index.html для client-side роутинга.
# Запросы /api/* и /club-ws сюда не попадают — хостовый nginx терминирует TLS
# и проксирует их прямо на gateway/club.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite immutable assets — кэш на год.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Prerender: для статичных маршрутов отдаём отдельные HTML с per-route
    # meta-тегами. Crawler/соцшаринг получают правильные SEO-теги до загрузки JS.
    # React Router после гидратации работает как обычно.
    location = /club {
        try_files /club.html /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /pricing {
        try_files /pricing.html /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /tournaments {
        try_files /tournaments.html /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA: всё, что не файл — отдаём index.html, react-router разберётся.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html и сгенерированные prerender-страницы — НЕ кэшировать,
    # иначе клиент будет видеть старый bundle.
    location ~ ^/(index|club|pricing|tournaments)\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Healthcheck.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Gzip — для текстовых ассетов.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
