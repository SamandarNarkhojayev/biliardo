<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#0f1623"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-ball" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3a4554"/>
      <stop offset="55%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </radialGradient>
    <radialGradient id="og-slider" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a3340"/>
      <stop offset="100%" stop-color="#141a26"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1a2030" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo block (left) -->
  <g transform="translate(110 165) scale(4.6)">
    <circle cx="24" cy="32" r="20" fill="url(#og-ball)"/>
    <path d="M13 24 Q11 19 16 16 Q20 14 23 16" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.92"/>
    <circle cx="14.5" cy="20.5" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="24" cy="32" r="7.8" fill="#ffffff"/>
    <text x="24" y="36.7" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="900" fill="#0f1419">8</text>
    <rect x="44" y="20.5" width="14" height="3" rx="1.5" fill="url(#og-slider)"/>
    <rect x="54.5" y="17" width="6.5" height="10" fill="#10b981" rx="0.5"/>
    <rect x="44" y="30.5" width="14" height="3" rx="1.5" fill="url(#og-slider)"/>
    <rect x="46.5" y="28" width="4.5" height="8" rx="1.2" fill="url(#og-slider)"/>
    <rect x="44" y="40.5" width="14" height="3" rx="1.5" fill="url(#og-slider)"/>
    <rect x="51.5" y="38" width="4.5" height="8" rx="1.2" fill="url(#og-slider)"/>
  </g>

  <!-- Brand text (right) -->
  <text x="600" y="270" font-family="Inter, Arial, sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-2">Biliardo</text>
  <text x="600" y="335" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600" fill="#10b981">Программа для бильярдного клуба</text>
  <text x="600" y="395" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Столы · тарифы · бар · отчёты · турниры</text>
  <text x="600" y="438" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">в одном приложении · Казахстан</text>

  <!-- emerald accent line -->
  <rect x="600" y="475" width="120" height="4" rx="2" fill="#10b981"/>
  <text x="600" y="528" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">biliardo.kz</text>
</svg>
