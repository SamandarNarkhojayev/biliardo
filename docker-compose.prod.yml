# Production-композ для biliardo.kz.
# Запуск: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Принципы:
#  - На хост наружу открыты ТОЛЬКО nginx (80/443). Все backend-сервисы
#    общаются через internal docker network, никаких published portов.
#  - Postgres/Redis тоже без публикации портов — доступны только через сеть compose.
#  - Все сервисы перезапускаются при падении (restart: unless-stopped).
#  - Healthcheck на postgres/redis/auth/gateway/web с зависимостями service_healthy.
#  - Ресурсные лимиты — чтобы один сервис не съел всю машину.
#  - Логи crop-нуты (json-file 10m × 3).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-defaults: &svc-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  postgres:
    <<: *svc-defaults
    image: postgres:16-alpine
    container_name: billiard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billiard}
      POSTGRES_USER: ${POSTGRES_USER:-billiard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billiard} -d ${POSTGRES_DB:-billiard}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 384M

  redis:
    <<: *svc-defaults
    image: redis:7-alpine
    container_name: billiard-redis
    # Persist для BullMQ-очередей (потеря очереди = потеря зависших регистраций).
    # appendonly + appendfsync everysec — стандарт для durability без сильной просадки.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 96M

  auth:
    <<: *svc-defaults
    image: ${REGISTRY:-ghcr.io/CHANGE_ME}/auth:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: billiard-auth
    command: ["sh", "-c", "npm --workspace @billiard/auth run migrate && npm --workspace @billiard/auth run start"]
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-billiard}?schema=auth
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set (>=32 chars)}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set (PEM PKCS8)}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set (PEM SPKI)}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-biliardo.kz}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${PUBLIC_APP_URL:-https://biliardo.kz}
      REGISTER_CONCURRENCY: ${REGISTER_CONCURRENCY:-8}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-kz-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-biliardo-media}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 256M

  payment:
    <<: *svc-defaults
    image: ${REGISTRY:-ghcr.io/CHANGE_ME}/payment:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: billiard-payment
    command: ["sh", "-c", "npm --workspace @billiard/payment run migrate && npm --workspace @billiard/payment run start"]
    environment:
      NODE_ENV: production
      PORT: 3003
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-billiard}?schema=payment
      AUTH_SERVICE_URL: http://auth:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      # Kaspi: stub (dev), bridge (перевод на Kaspi Gold) или live (QR Merchant API).
      # В prod KASPI_MODE должен быть bridge или live (stub запрещён).
      KASPI_MODE: ${KASPI_MODE:-bridge}
      # live-режим:
      KASPI_API_URL: ${KASPI_API_URL:-}
      KASPI_MERCHANT_ID: ${KASPI_MERCHANT_ID:-}
      KASPI_API_KEY: ${KASPI_API_KEY:-}
      KASPI_WEBHOOK_SECRET: ${KASPI_WEBHOOK_SECRET:-}
      # zod на стороне payment требует URL — даём валидный test-эндпоинт как дефолт
      KASPI_BASE_DOMAIN: ${KASPI_BASE_DOMAIN:-https://mtokentest.kaspi.kz}
      KASPI_SCHEME: ${KASPI_SCHEME:-r3}
      KASPI_DEVICE_TOKEN: ${KASPI_DEVICE_TOKEN:-}
      KASPI_ORGANIZATION_BIN: ${KASPI_ORGANIZATION_BIN:-}
      KASPI_TEST_MODE: ${KASPI_TEST_MODE:-false}
      # bridge-режим (перевод на Kaspi Gold):
      KASPI_BRIDGE_SECRET: ${KASPI_BRIDGE_SECRET:-}
      KASPI_GOLD_NUMBER: ${KASPI_GOLD_NUMBER:-}
      KASPI_GOLD_NAME: ${KASPI_GOLD_NAME:-}
      KASPI_BRIDGE_AMOUNT_SPREAD: ${KASPI_BRIDGE_AMOUNT_SPREAD:-100}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://biliardo.kz}
      CORS_ORIGINS: ${PUBLIC_APP_URL:-https://biliardo.kz}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 150M

  club:
    <<: *svc-defaults
    image: ${REGISTRY:-ghcr.io/CHANGE_ME}/club:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/club/Dockerfile
    container_name: billiard-club
    command: ["sh", "-c", "npm --workspace @billiard/club run migrate && npm --workspace @billiard/club run start"]
    environment:
      NODE_ENV: production
      PORT: 3004
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-billiard}?schema=club
      AUTH_SERVICE_URL: http://auth:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CORS_ORIGINS: ${PUBLIC_APP_URL:-https://biliardo.kz}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 150M

  tournament:
    <<: *svc-defaults
    image: ${REGISTRY:-ghcr.io/CHANGE_ME}/tournament:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/tournament/Dockerfile
    container_name: billiard-tournament
    command: ["sh", "-c", "npm --workspace @billiard/tournament run migrate && npm --workspace @billiard/tournament run start"]
    environment:
      NODE_ENV: production
      PORT: 3002
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-billiard}?schema=tournament
      AUTH_SERVICE_URL: http://auth:3001
      BOT_SERVICE_URL: http://bot:3005
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://biliardo.kz}
      CORS_ORIGINS: ${PUBLIC_APP_URL:-https://biliardo.kz}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 200M

  bot:
    <<: *svc-defaults
    image: ${REGISTRY:-ghcr.io/CHANGE_ME}/bot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    container_name: billiard-bot
    environment:
      NODE_ENV: production
      PORT: 3005
      HOST: 0.0.0.0
      LOG_LEVEL: info
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set in prod}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      AUTH_SERVICE_URL: http://auth:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://biliardo.kz}
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  admin:
    <<: *svc-defaults
    image: ${REGISTRY:-ghcr.io/CHANGE_ME}/admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    container_name: billiard-admin
    command: ["sh", "-c", "npm --workspace @billiard/admin run migrate && npm --workspace @billiard/admin run start"]
    environment:
      NODE_ENV: production
      PORT: 3006
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-billiard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-billiard}?schema=admin
      AUTH_SERVICE_URL: http://auth:3001
      TOURNAMENT_SERVICE_URL: http://tournament:3002
      PAYMENT_SERVICE_URL: http://payment:3003
      CLUB_SERVICE_URL: http://club:3004
      BOT_SERVICE_URL: http://bot:3005
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CORS_ORIGINS: ${PUBLIC_APP_URL:-https://biliardo.kz}
      SQL_TIMEOUT_MS: ${SQL_TIMEOUT_MS:-15000}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3006/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  gateway:
    <<: *svc-defaults
    image: ${REGISTRY:-ghcr.io/CHANGE_ME}/gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: billiard-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      AUTH_SERVICE_URL: http://auth:3001
      TOURNAMENT_SERVICE_URL: http://tournament:3002
      PAYMENT_SERVICE_URL: http://payment:3003
      CLUB_SERVICE_URL: http://club:3004
      ADMIN_SERVICE_URL: http://admin:3006
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${PUBLIC_APP_URL:-https://biliardo.kz}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
    depends_on:
      auth:
        condition: service_healthy
      payment:
        condition: service_healthy
      club:
        condition: service_healthy
      redis:
        condition: service_healthy
      tournament:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 200M

  web:
    <<: *svc-defaults
    image: ${REGISTRY:-ghcr.io/CHANGE_ME}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_CLUB_WS_URL: ${VITE_CLUB_WS_URL:-wss://biliardo.kz/club-ws}
    container_name: billiard-web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 32M

  nginx:
    <<: *svc-defaults
    image: nginx:1.27-alpine
    container_name: billiard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/biliardo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/proxy_common.inc:/etc/nginx/conf.d/proxy_common.inc:ro
      - ./infra/nginx/options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 48M

  # certbot: --webroot. Запуск выпуска/продления — отдельной командой,
  # см. infra/nginx/README.md.
  certbot:
    image: certbot/certbot:latest
    container_name: billiard-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

  # Daily Postgres → S3 backup. Запускает scripts/backup-db.sh каждые 24 часа.
  # Образ собирается с postgresql-client + awscli + python3.
  backup:
    <<: *svc-defaults
    image: alpine:3.20
    container_name: billiard-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-billiard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billiard}
      POSTGRES_DB: ${POSTGRES_DB:-billiard}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-kz-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-biliardo-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache postgresql16-client aws-cli python3 bash coreutils >/dev/null
        echo "[backup] daemon started (interval 24h)"
        while :; do
          bash /usr/local/bin/backup-db.sh || echo "[backup] FAILED at $$(date -u)"
          sleep 86400
        done

volumes:
  postgres_data:
  redis_data:
  certbot_www:
