name: Deploy

# Каждый пуш в main: тесты → сборка и push образов в GHCR → деплой на сервер по SSH.
on:
  push:
    branches:
      - main

jobs:
  test:
    name: Typecheck + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma clients
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npm --workspace @billiard/auth run generate
          npm --workspace @billiard/payment run generate
          npm --workspace @billiard/club run generate
          npm --workspace @billiard/tournament run generate
          npm --workspace @billiard/admin run generate

      - run: npm run typecheck
      - run: npm run verify:brackets

  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth, payment, club, tournament, bot, admin, gateway, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Registry в нижнем регистре
        id: reg
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Определить Dockerfile
        id: df
        run: |
          if [ "${{ matrix.service }}" = "web" ]; then
            echo "file=apps/web/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=services/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.df.outputs.file }}
          push: true
          tags: |
            ${{ steps.reg.outputs.registry }}/${{ matrix.service }}:latest
            ${{ steps.reg.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
          # build-args нужны только web; для остальных образов они просто игнорируются.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
            VITE_CLUB_WS_URL=${{ vars.VITE_CLUB_WS_URL || 'wss://biliardo.kz/club-ws' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    # Не прерываем идущий деплой следующим пушем — встаём в очередь.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Registry в нижнем регистре
        id: reg
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Деплой по SSH
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ${{ steps.reg.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/biliardo' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: REGISTRY,IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN,DEPLOY_PATH
          # appleboy/ssh-action v1 убрал script_stop — управляем через `set -e` в скрипте.
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # Берём актуальные compose/infra/scripts из main (образы тянутся из registry).
            git fetch --all --prune
            git reset --hard origin/main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
