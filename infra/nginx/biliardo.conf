# nginx host config для biliardo.kz.
#
# Раскладка:
#   biliardo.kz, www.biliardo.kz  — фронт (SPA из контейнера web)
#   biliardo.kz/api/*             — реверс-прокси на gateway:3000
#   biliardo.kz/club-ws            — WebSocket → club:3004 (desktop-клиент)
#
# Что делает этот слой:
#   1) TLS-терминация (letsencrypt /etc/letsencrypt/live/biliardo.kz/)
#   2) HTTP→HTTPS redirect, www→apex redirect
#   3) Security headers: HSTS, CSP, X-Frame, etc.
#   4) Limit зон connections / req — DDoS-щит первого уровня (это ДО app rate-limit)
#   5) Proxy timeouts и буферы под Server-Sent Events / WebSocket
#
# Запускается в контейнере nginx из docker-compose.prod.yml. Сертификаты
# монтируются read-only из /etc/letsencrypt хоста.

# ---- Rate limit зоны ----
# 10 MB зоны хватает примерно на 160 000 IP — норм для регионального продукта.
limit_req_zone $binary_remote_addr zone=req_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=req_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ---- HTTP → HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name biliardo.kz www.biliardo.kz;

    # ACME challenge для letsencrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное → HTTPS
    location / {
        return 301 https://biliardo.kz$request_uri;
    }
}

# ---- www → apex redirect (на HTTPS) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.biliardo.kz;

    ssl_certificate /etc/letsencrypt/live/biliardo.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biliardo.kz/privkey.pem;
    include /etc/nginx/options-ssl-nginx.conf;

    return 301 https://biliardo.kz$request_uri;
}

# ---- Main HTTPS server ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name biliardo.kz;

    ssl_certificate /etc/letsencrypt/live/biliardo.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biliardo.kz/privkey.pem;
    include /etc/nginx/options-ssl-nginx.conf;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP оставляем минималистичный — Vite иногда инжектит inline (можно ужесточить).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss://biliardo.kz; frame-ancestors 'none';" always;

    # ---- Defaults ----
    client_max_body_size 2m;
    limit_conn conn_per_ip 30;

    # ---- /api/auth/* — узкий rate-limit перед app-уровнем ----
    location ~ ^/api/auth/(login|register|refresh)$ {
        limit_req zone=req_auth burst=5 nodelay;
        proxy_pass http://gateway:3000;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ---- /api/* — gateway ----
    location /api/ {
        limit_req zone=req_general burst=50 nodelay;
        proxy_pass http://gateway:3000;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ---- WebSocket для desktop-клиента клуба ----
    # Десктоп подключается прямо к club-сервису (минуя gateway):
    # wss://biliardo.kz/club-ws → club:3004/ws (см. ws-route.ts)
    location /club-ws {
        proxy_pass http://club:3004/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Всё остальное — фронт (контейнер web с nginx внутри) ----
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
